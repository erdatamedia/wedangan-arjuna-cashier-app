# /etc/nginx/sites-available/wedangan-arjuna.nwsn.cc
# Certbot akan menambahkan blok HTTPS (listen 443) dan redirect secara otomatis.
server {
    listen 80;
    listen [::]:80;
    server_name wedangan-arjuna.nwsn.cc;

    root /var/www/wedangan-arjuna;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Service worker & shell: jangan di-cache lama agar update cepat sampai ke HP kasir.
    location = /sw.js            { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html       { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }
    location ~ ^/workbox-.*\.js$ { add_header Cache-Control "no-cache"; }

    # Aset ber-hash dari Vite: aman di-cache setahun.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ /index.html;
    }
}
